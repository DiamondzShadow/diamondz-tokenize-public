# Diamondz Tokenize — Stellar (Soroban) edition.
# contracts/* are OpenZeppelin Stellar Contracts v0.8.0 RWA examples (MIT, see contracts/LICENSE-OPENZEPPELIN),
# built against the published stellar-* 0.8.0 crates instead of the OZ repo's path deps.
[workspace]
resolver = "2"
members = ["contracts/*"]
exclude = ["contracts/sign-claim"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/DiamondzShadow/diamondz-tokenize"
version = "0.8.0"
authors = ["OpenZeppelin", "Diamondz"]

[workspace.dependencies]
soroban-sdk = "28.0.0"
stellar-access = "0.8.0"
stellar-contract-utils = "0.8.0"
stellar-macros = "0.8.0"
stellar-tokens = "0.8.0"
ed25519-dalek = "2.1.1"
hex-literal = "1.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
