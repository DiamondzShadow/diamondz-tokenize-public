# Secrets the deployed CRE workflows read from the Chainlink Vault DON.
# Left: secret ID the workflow asks for. Right: the variable in vault.env that holds the value.
# Values never go in this file or in git.
secretsNames:
  UNIBLOCK_API_KEY_SECRET:
    - UNIBLOCK_KEY_VAR
  FRED_API_KEY_SECRET:
    - FRED_KEY_VAR
  MASSIVE_API_KEY_SECRET:
    - MASSIVE_KEY_VAR
